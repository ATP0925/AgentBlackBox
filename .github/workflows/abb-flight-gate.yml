name: AgentBlackBox Flight Gate & Enterprise CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  gate:
    name: Flight Gate (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    env:
      ABB_EPHEMERAL_TEST_KEY: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Test Suite
        run: python -m pytest tests/ -v --tb=short

      - name: Execute Pre-Push Cryptographic CI Gate
        run: python -m agentblackbox ci-gate --max-risk 7.0 --sarif-out abb-results.sarif

      - name: Upload SARIF report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sarif-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: abb-results.sarif
          if-no-files-found: ignore
