[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abb-recorder"
version = "0.4.0"
description = "Cryptographic flight recorder, real-time architectural drift guard, and automated code review engine for autonomous AI coding agents (Claude Code, Cursor, Codex, Gemini, Antigravity)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Pratik Atpadkar", email = "atpadkarmaruti@gmail.com" },
]
keywords = [
    "ai-agents",
    "flight-recorder",
    "claude-code",
    "cursor",
    "codex",
    "gemini-cli",
    "antigravity",
    "code-review",
    "drift-detection",
    "audit-trail",
    "hmac-sha256",
    "sarif",
    "devsecops",
    "secret-detection",
    "static-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "watchdog>=4.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
    "gitpython>=3.1.0",
    "pydantic>=2.7.0",
    "structlog>=24.0.0",
    "keyring>=25.0.0",
]

[project.urls]
Homepage = "https://github.com/ATP0925/AgentBlackBox"
Repository = "https://github.com/ATP0925/AgentBlackBox.git"
Issues = "https://github.com/ATP0925/AgentBlackBox/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
abb = "agentblackbox.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentblackbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

