[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abb-recorder"
version = "0.4.0"
description = "Local-first audit & replay flight recorder for AI coding agents — automatically redact secrets, track file & command diffs, score command risk, and verify session timelines."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Pratik Atpadkar" },
]
keywords = ["ai-agents", "claude-code", "audit-log", "secret-detection", "flight-recorder", "security", "python", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
]
dependencies = [
    "watchdog>=4.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
    "gitpython>=3.1.0",
    "pydantic>=2.7.0",
    "structlog>=24.0.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
abb = "agentblackbox.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentblackbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

